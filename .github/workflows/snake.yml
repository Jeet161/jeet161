name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day at midnight UTC
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Jeet161
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300F0FF&color_dots=%23161B22,%23003554,%23006494,%230582ca,%2300f0ff
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300F0FF&color_dots=%23161B22,%23003554,%23006494,%230582ca,%2300f0ff

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
